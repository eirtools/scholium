[package]
name = "cargo-scholium"

description = "scholium::mark report tool"

readme = "cargo-io.md"
edition = "2024"
rust-version = "1.86.0"

version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
keywords.workspace = true
authors.workspace = true

[dependencies]
cargo_metadata = { version = "0.23.1" }
walkdir = { version = "2.5.0" }
rayon = { version = "1.12.0" }
indexmap = { version = "2.14.0", features = ["rayon"] }

scholium = { workspace = true }
scholium-core = { workspace = true, features = ["with-details"] }

unicode-ident = { version = "1.0.24" }
proc-macro2 = { workspace = true, features = ["span-locations"] }
syn = { workspace = true, features = [
  "parsing",
  "proc-macro",
  "full",
  "printing",
  "visit",
] }

clap = { version = "4.6.6", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151" }
toml = { version = "1.1.4" }

nu-ansi-term = { version = "0.50.3" }
tracing-core = { version = "0.1.36" }
tracing-log = { version = "0.2.0" }
tracing = { version = "0.1.44", features = [
  "log",
  "valuable",
], default-features = false }
tracing-subscriber = { workspace = true, features = [
  "env-filter",
  "valuable",
  "local-time",
  "std",
  "json",
] }

[dev-dependencies]

rstest = { workspace = true }
assert_matches = { version = "1.5.0" }
